services:
  - type: web
    name: nfcorpus-jhonn-saeteros
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python retrieval.py
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
